body:
  - type: passwordBox
    attributes:
      name: api_key
      label: "Groq API Key:"
      defaultValue: ""
      description: "Enter your Groq API Key from console.groq.com/keys"
  - type: checkbox
    attributes:
      name: concise_mode
      label: "Concise Mode (Recommended)"
      defaultValue: "true"
      description: "Keep AI responses short and direct to fit cleanly in Flow Launcher"